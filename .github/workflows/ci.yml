name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Fyne's GLFW/OpenGL backend needs cgo and these headers. None are
      # preinstalled on any runner image.
      - name: Install Fyne build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      # Core.Arm() calls runner.Lookup(), a hardcoded exec.LookPath("claude")
      # that is independent of the runner.Fake every test otherwise injects
      # for the actual invocation -- LookPath just needs *something*
      # executable named `claude` to resolve, and never runs it. Without
      # this, every internal/app and internal/ui test that calls Arm() fails
      # here with "claude not found on PATH" on any runner that doesn't
      # happen to have the real CLI installed -- i.e. every GitHub-hosted
      # runner. Confirmed against a real run. This was invisible before this
      # workflow existed, because it happened to pass on developer machines
      # with the real CLI already on PATH. The suite itself is otherwise
      # headless: no display, no network, no API spend -- the real
      # invocation goes through runner.Fake or, in internal/runner's own
      # tests, shell-script stand-ins.
      - name: Provide a stand-in claude on PATH (Arm() only resolves it)
        run: |
          mkdir -p "$RUNNER_TEMP/stubbin"
          printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/stubbin/claude"
          chmod +x "$RUNNER_TEMP/stubbin/claude"
          echo "$RUNNER_TEMP/stubbin" >> "$GITHUB_PATH"

      # `set -o pipefail` is required here: GitHub's default runner shell is
      # `bash -e {0}`, with no `-o pipefail`, so without it the exit status of
      # `tee` (always 0) would win over `go test`'s and this step would report
      # success on a genuine test failure or even a compile error. Confirmed
      # against a real run: a race-flaked `go test` failure left this step
      # green until this line was added.
      - name: Test
        run: |
          set -o pipefail
          go test -race -cover ./... 2>&1 | tee test.log

      # This string means a widget was touched from a goroutine other than the
      # Fyne one without going through fyne.Do. Fyne v2.8 repairs and logs it;
      # v2.9 turns it into a crash. It must never appear.
      - name: Assert no Fyne threading violations
        run: |
          # A missing test.log must fail loudly, not be swallowed by grep's
          # own "no match" exit status: `grep -q ... test.log` on a nonexistent
          # file also returns 1, so without this check a missing log and a
          # clean log are indistinguishable and this step would print its OK
          # message having checked nothing. Confirmed empirically. Unreachable
          # today only because this step runs after a successful Test step,
          # which always creates the file -- do not rely on that staying true.
          if [ ! -f test.log ]; then
            echo "::error::test.log not found -- the Test step did not produce it"
            exit 1
          fi
          if grep -q "Error in Fyne call thread" test.log; then
            echo "::error::a widget was touched outside the Fyne goroutine"
            exit 1
          fi
          echo "OK: no threading violations"

  package-smoke:
    # Runs the REAL packaging path on push to main and on pull requests
    # targeting main (this workflow's only two triggers), so the release
    # workflow is never the first thing to discover a break. A push to a
    # feature branch alone does not run this job. Publishes nothing.
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:22.04
    env:
      CGO_ENABLED: "1"
      DEBIAN_FRONTEND: noninteractive
      MAX_GLIBC: GLIBC_2.35
    steps:
      # Before checkout: the base image has no git, curl or CA certificates,
      # and there is no sudo.
      - name: Install toolchain and Fyne build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config git curl ca-certificates xz-utils file binutils \
            libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - uses: actions/checkout@v7

      - name: Mark the workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Pinned, not @latest: scripts/package-linux.sh carries a sed patch for a
      # Makefile-generation bug specific to fyne.io/tools@v1.7.2 (see that
      # script's "Patching the shipped Makefile's Icon variable" step). Bumping
      # this requires re-checking whether that patch is still needed or needs
      # updating first.
      - name: Install the fyne CLI
        run: |
          go install fyne.io/tools/cmd/fyne@v1.7.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # 0.0.0 rather than a pre-release string: fyne's --app-version accepts
      # only integers and dots up to x.y.z.
      - name: Package
        run: scripts/package-linux.sh 0.0.0 "$GITHUB_RUN_NUMBER"

      - uses: actions/upload-artifact@v7
        with:
          name: smoke-artifacts
          path: dist/
          retention-days: 7
